<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Digging Dwarfs</title>
  <meta name="description" content="Eine gemütliche Zwergen-Ameisenfarm: Beobachte süße Zwerge, wie sie Stollen graben und nach Gold, Kristallen und Diamanten suchen.">
  <meta name="theme-color" content="#2a1a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Digging Dwarfs">
  <meta property="og:title" content="Digging Dwarfs">
  <meta property="og:description" content="Beobachte süße Zwerge in ihrer isometrischen Ameisenfarm beim Graben nach Schätzen.">
  <meta property="og:image" content="assets/splash.jpg">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" aria-label="Zwergen-Ameisenfarm"></canvas>

    <div id="hud-top">
      <div class="pill" id="gold" title="Gold"><span data-icon="coin"></span><span id="gold-val">0</span></div>
      <div class="pill small" title="Tag"><span id="clock-ico" data-icon="sun"></span><span id="day-val">1</span></div>
      <div class="spacer"></div>
      <div class="pill small" title="Zwerge"><span data-icon="dwarf"></span><span id="pop-val">3</span></div>
      <button class="round" id="btn-watch" aria-label="Zuschauen"><span data-icon="eye"></span></button>
      <button class="round" id="btn-sound" aria-label="Ton an/aus"><span data-icon="sound"></span></button>
      <button class="round" id="btn-menu" aria-label="Menü"><span data-icon="menu"></span></button>
    </div>

    <div id="ticker" aria-live="polite"></div>

    <div id="dwarf-card" hidden>
      <i class="portrait big" id="card-portrait"></i>
      <div class="card-main">
        <div class="card-title"><b id="card-name">Zwerg</b><span id="card-level"></span></div>
        <div id="card-act"></div>
        <div class="energy"><div id="card-energy"></div></div>
        <div id="card-sack"></div>
      </div>
      <div class="card-btns">
        <button id="card-follow" aria-label="Folgen"><span data-icon="eye"></span></button>
        <button id="card-close" aria-label="Schließen"><span data-icon="close"></span></button>
      </div>
    </div>

    <div id="hint" hidden><span data-icon="flag"></span><span>Tippe in die Erde</span></div>

    <div id="hud-bottom">
      <div class="horn-row">
        <div id="horns"><span class="horn"><span data-icon="horn"></span></span><span class="horn"><span data-icon="horn"></span></span><span class="horn"><span data-icon="horn"></span></span></div>
        <span id="buff" class="buff" hidden><span data-icon="beer"></span><span id="buff-val"></span></span>
        <button id="btn-speed" class="speed" aria-label="Tempo"><span data-icon="play"></span></button>
      </div>
      <div class="actions">
        <button id="btn-flag" aria-label="Graben-Befehl"><span data-icon="flag"></span></button>
        <button id="btn-feast" aria-label="Festmahl"><span data-icon="beer"></span></button>
        <button id="btn-shop" aria-label="Werkstatt"><span data-icon="hammer"></span></button>
        <button id="btn-treasury" aria-label="Schätze"><span data-icon="chest"></span></button>
      </div>
    </div>

    <div id="sheet" hidden><div id="sheet-panel"><div id="sheet-body"></div></div></div>
    <div id="toast"></div>

    <div id="start">
      <div class="start-inner">
        <div id="loading">
          <div class="load-track"><div id="load-bar"></div></div>
        </div>
        <div id="start-buttons" hidden>
          <button id="btn-play" class="big-btn">Spielen</button>
          <button id="btn-new" class="link-btn" hidden>Neue Farm</button>
        </div>
      </div>
    </div>
  </div>
  <noscript>Digging Dwarfs braucht JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
